<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📚 3D Bookshelf — Web Explorer</title>
<style>
:root{
  --bg1:#0d0e1a;--bg2:#04040a;--text:#e9ecf4;--muted:rgba(205,212,228,.55);--dim:rgba(205,212,228,.32);
  --line:rgba(255,255,255,.09);--panel:rgba(255,255,255,.035);--mono:"SF Mono","JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:radial-gradient(130% 90% at 50% 0%,var(--bg1),var(--bg2) 78%);
  color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased;
}
#canvas3d{position:fixed;inset:0;display:block;touch-action:none}

#errorBanner{position:fixed;top:14px;left:14px;right:14px;z-index:300;display:none;padding:10px 14px;border-radius:10px;background:rgba(178,24,24,.88);color:#fff;font-size:.8rem;font-family:var(--mono);word-break:break-all}
#errorBanner.show{display:block}

.ui-overlay{position:fixed;z-index:10;pointer-events:none}
.ui-overlay .click-btn{pointer-events:auto}

.top-bar{top:0;left:0;right:0;padding:22px 34px;display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,rgba(4,4,10,.55) 0%,transparent 100%)}
.logo{font-size:1.25rem;font-weight:700;background:linear-gradient(135deg,#7b93ff,#c467d2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{font-size:.76rem;color:var(--muted);margin-top:3px}
.hint{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--muted);padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);backdrop-filter:blur(6px);white-space:nowrap}
kbd{font-family:var(--mono);font-size:.64rem;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:5px;padding:2px 7px;margin-right:4px}
@media(max-width:640px){.hint{display:none}}

.info-panel{bottom:0;left:0;right:0;display:flex;justify-content:center;padding:0 16px 26px}
.ip-card{position:relative;width:min(440px,100%);padding:16px 22px 18px;border-radius:16px;background:rgba(14,15,26,.72);border:1px solid var(--line);backdrop-filter:blur(14px);transform:translateY(14px);opacity:0;transition:transform .45s cubic-bezier(.16,1,.3,1),opacity .45s ease}
.info-panel.visible .ip-card{transform:translateY(0);opacity:1}
.ip-card::before{content:'';position:absolute;top:0;left:14px;right:14px;height:3px;border-radius:2px;background:var(--ipc,#667eea)}
.ip-index{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;color:var(--ipc);opacity:.9}
.info-title{display:flex;align-items:center;gap:9px;font-size:1.15rem;font-weight:700;margin:8px 0 5px}
.info-icon{font-size:1.2rem}
.info-desc{font-size:.84rem;color:var(--muted);line-height:1.55}
.click-btn{margin-top:14px;width:100%;padding:11px 18px;border-radius:999px;cursor:pointer;border:1px solid rgba(255,255,255,.16);background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.05));color:var(--text);font-size:.88rem;font-weight:600;transition:transform .25s,box-shadow .25s,border-color .25s}
.click-btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.45);border-color:rgba(255,255,255,.35)}
.click-btn:active{transform:translateY(0)}
.ip-keys{margin-top:13px;display:flex;justify-content:center;gap:14px;font-size:.66rem;color:var(--dim)}
@media(max-width:600px){.ip-keys{display:none}.info-panel{padding-bottom:16px}.ip-card{padding:14px 16px}}

.modal-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,3,8,.88);backdrop-filter:blur(14px)}
.modal-overlay.active{display:flex}
.modal-content{width:min(92vw,900px);height:min(82vh,620px);border-radius:16px;overflow:hidden;background:#101220;box-shadow:0 40px 100px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1);animation:modalIn .45s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column}
@keyframes modalIn{from{transform:scale(.93) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02);position:relative}
.modal-header::before{content:'';position:absolute;top:0;left:0;height:3px;width:140px;background:var(--mc,#667eea);border-radius:3px}
.modal-title{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1rem}
.modal-icon{font-size:1.25rem}
.modal-close{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--muted);font-size:.95rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.modal-close:hover{background:rgba(255,255,255,.14);color:#fff;transform:rotate(90deg)}
.modal-body{flex:1;position:relative}
.modal-body iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.modal-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.03),transparent 60%);color:var(--muted);font-size:.88rem;letter-spacing:.05em}
.spinner{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.1);border-top-color:var(--mc,#667eea);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-progress{width:160px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.modal-progress i{display:block;width:0%;height:100%;background:var(--mc,#667eea)}

.book-label{position:fixed;z-index:5;pointer-events:none;padding:5px 11px;border-radius:999px;background:rgba(8,9,18,.72);border:1px solid var(--line);backdrop-filter:blur(8px);font-size:.72rem;font-weight:600;color:rgba(233,236,244,.85);display:flex;align-items:center;gap:7px;white-space:nowrap;transform:translate(-50%,-100%)}
.book-label .dot{width:7px;height:7px;border-radius:50%;background:var(--ipc,#667eea);box-shadow:0 0 8px var(--ipc)}

#webgl-fail{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;text-align:center;padding:40px;font-size:.95rem;line-height:1.8;color:var(--muted)}
#webgl-fail.show{display:flex}
@media(max-width:600px){.modal-content{height:84vh;border-radius:12px}}
</style>
</head>
<body>
<canvas id="canvas3d"></canvas>
<div id="errorBanner"></div>
<div id="webgl-fail"><div><b>⚠ WebGL 不可用</b><br>本页面需要 WebGL 渲染 3D 书架，<br>请更新浏览器或启用 GPU 硬件加速后重试。</div></div>

<div class="ui-overlay top-bar">
  <div>
    <div class="logo">📚 3D Bookshelf</div>
    <div class="subtitle">点击书架上的书，进入网页世界 · Three.js</div>
  </div>
  <div class="hint"><kbd>↔</kbd> 拖拽旋转 <kbd>⇄</kbd> 滚轮缩放 <kbd>1–7</kbd> 翻开</div>
</div>

<div class="ui-overlay info-panel" id="infoPanel">
  <div class="ip-card" id="ipCard">
    <div class="ip-index" id="ipIndex">— / 07</div>
    <h2 class="info-title"><span class="info-icon" id="infoIcon">📖</span><span id="infoTitle">—</span></h2>
    <p class="info-desc" id="infoDesc">将鼠标移向一本书</p>
    <button class="click-btn" id="infoBtn">翻开这本书 <span>→</span></button>
    <div class="ip-keys"><span><kbd>Enter</kbd> 翻开</span><span><kbd>1–7</kbd> 直达</span><span><kbd>Esc</kbd> 关闭</span></div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <div class="modal-header" id="modalHeader">
      <div class="modal-title"><span class="modal-icon" id="modalIcon">📖</span><span id="modalTitle">—</span></div>
      <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="modal-loading" id="modalLoading">
        <div class="spinner"></div>
        <span id="modalLoadMsg">正在打开书页…</span>
        <div class="modal-progress"><i id="modalProg"></i></div>
      </div>
      <iframe id="modalIframe" src="about:blank" title="书页"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"></iframe>
    </div>
  </div>
</div>

<div id="labelsContainer"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = p => 1 - Math.pow(1 - p, 3);

/* 错误横幅（开发守卫） */
const errB = document.getElementById('errorBanner');
const addErr = (m) => { if (errB) { errB.textContent = String(m); errB.classList.add('show'); } };
window.addEventListener('error', e => { addErr(e.error ? (e.error.message || e.error.name) : (e.message || 'script error')); });
window.addEventListener('unhandledrejection', e => addErr('unhandled rejection'));

/* ─── 书本数据 ─── */
const BOOKS = [
  { title:'Wikipedia',    icon:'📚', desc:'人类知识的总和',   color:'#5e7d2f', spine:'#46622a', src:'https://zh.wikipedia.org/wiki/Portal:Today', accent:'#8fb54a' },
  { title:'Hacker News',  icon:'🔥', desc:'科技圈热点资讯',   color:'#ff6b35', spine:'#c7501e', src:'https://news.ycombinator.com', accent:'#ff8a5e' },
  { title:'GitHub',       icon:'🐙', desc:'全球最大开源社区', color:'#8b949e', spine:'#565f68', src:'https://github.com/trending', accent:'#9fb0b9' },
  { title:'Dribbble',     icon:'🎨', desc:'设计师灵感天堂',   color:'#ea4c89', spine:'#c03564', src:'https://dribbble.com', accent:'#f06a9d' },
  { title:'Awwwards',     icon:'🏆', desc:'顶尖网页设计大奖', color:'#e6b622', spine:'#b39014', src:'https://www.awwwards.com', accent:'#f0c95a' },
  { title:'Product Hunt', icon:'🚀', desc:'最新最酷的科技产品', color:'#ff4655', spine:'#c9353f', src:'https://www.producthunt.com', accent:'#ff6a75' },
  { title:'Reddit',       icon:'👺', desc:'互联网的首页',     color:'#ff4500', spine:'#cc3700', src:'https://www.reddit.com/r/popular', accent:'#ff7a44' },
];

const canvas = document.getElementById('canvas3d');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('webgl-fail').classList.add('show');
  addErr('WebGL 初始化失败: ' + (e.message || e));
  throw e;
}
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const FOG = 0x080910;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOG, 0.045);
scene.background = new THREE.Color(FOG);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;            /* v2: 禁止平移，视角不会跑飞 */
controls.minDistance = 4.5;
controls.maxDistance = 18;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = 1.5;          /* v2: 不允许转到地面下方 */
controls.target.set(0, 1.35, 0);
controls.update();

/* ─── 灯光 ─── */
scene.add(new THREE.AmbientLight(0x44446a, 0.55));
const key = new THREE.DirectionalLight(0xfff2d8, 1.5);
key.position.set(6, 9, 4);
key.castShadow = true;
key.shadow.bias = -0.0008;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5; key.shadow.camera.far = 30;
key.shadow.camera.left = -9; key.shadow.camera.right = 9; key.shadow.camera.top = 8; key.shadow.camera.bottom = -2;
scene.add(key);
const fill = new THREE.DirectionalLight(0x667eea, 0.45); fill.position.set(-6, 4, -4); scene.add(fill);
const rim = new THREE.PointLight(0x9b6cc4, 0.9, 30); rim.position.set(0, 7, -6); scene.add(rim);
const lamp = new THREE.PointLight(0xffb36b, 1.1, 12); lamp.position.set(0, 3.7, 0.4); scene.add(lamp);

/* ─── 地面：径向暗角纹理 ─── */
{
  const cvs = document.createElement('canvas'); cvs.width = cvs.height = 1024;
  const ctx = cvs.getContext('2d');
  const g = ctx.createRadialGradient(512, 512, 60, 512, 512, 800);
  g.addColorStop(0, '#1b1d2e'); g.addColorStop(0.55, '#0e0e19'); g.addColorStop(1, '#05050a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1024, 1024);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50),
    new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(cvs), color: 0xffffff, roughness: 0.85 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
  scene.add(floor);
}

/* ─── 书架结构 ─── */
{
  const wood = new THREE.MeshStandardMaterial({ color: 0x4a3526, roughness: 0.7, metalness: 0.05 });
  const trim = new THREE.MeshStandardMaterial({ color: 0x5c4230, roughness: 0.6 });
  const add = (w, h, d, x, y, z, m = wood) => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    mesh.position.set(x, y, z); mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);
  };
  add(12, 0.15, 2, 0, 0.6, 0);
  /* v2: 饰条改为层板前沿薄边沿 (lip) — 不再与书本相交 */
  add(12.0, 0.09, 0.08, 0, 0.71, 0.96);
  add(0.12, 5, 2, 6, 3, 0);
  add(0.12, 5, 2, -6, 3, 0);
  add(12, 5, 0.08, 0, 3, -1, new THREE.MeshStandardMaterial({ color: 0x2a1a0f, roughness: 0.9 }));
  add(12.4, 0.15, 2.2, 0, 5.5, 0, trim);
  /* 第二层架 + 暖光灯带（填充原本的"死空间"） */
  add(12, 0.12, 2, 0, 3.5, 0);
  add(12.2, 0.06, 2.1, 0, 3.61, 0, trim);
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(11.7, 0.12),
    new THREE.MeshBasicMaterial({ color: 0xffb36b, transparent: true, opacity: 0.5 }));
  glow.position.set(0, 3.51, 1.012);
  scene.add(glow);
}

/* ─── 封面 / 书脊纹理（v2: 标题画在正面封面，比例正确） ─── */
function makeCoverTexture(b, front) {
  const W = 512, H = 1280;
  const cvs = document.createElement('canvas'); cvs.width = W; cvs.height = H;
  const ctx = cvs.getContext('2d');
  const c = new THREE.Color(b.color);
  const col = (k) => '#' + (new THREE.Color(c).multiplyScalar(k).getHex());
  const g = ctx.createLinearGradient(0, 0, W, H);
  if (front) { g.addColorStop(0, col(1.1)); g.addColorStop(0.55, col(0.75)); g.addColorStop(1, col(0.45)); }
  else { g.addColorStop(0, col(0.5)); g.addColorStop(0.55, col(0.3)); g.addColorStop(1, col(0.16)); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 700; i++) { ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`; ctx.fillRect(Math.random() * W, Math.random() * H, 2, 2); }
  ctx.strokeStyle = 'rgba(255,255,255,' + (front ? 0.3 : 0.18) + ')';
  ctx.lineWidth = 4; ctx.strokeRect(28, 28, W - 56, H - 56);
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,' + (front ? 0.18 : 0.1) + ')'; ctx.strokeRect(44, 44, W - 88, H - 88);
  const cy = 300;
  ctx.fillStyle = 'rgba(255,255,255,' + (front ? 0.14 : 0.07) + ')';
  ctx.beginPath(); ctx.arc(W / 2, cy, 92, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,' + (front ? 0.5 : 0.22) + ')';
  ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(W / 2, cy, 92, 0, Math.PI * 2); ctx.stroke();
  if (front) {
    ctx.font = '700 84px Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillText(b.icon, W / 2, cy);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W * 0.34, 520); ctx.lineTo(W * 0.66, 520); ctx.stroke();
    const words = b.title.split(/\s+/);
    const lines = [];
    let line = '';
    ctx.font = '700 62px Georgia, serif';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width <= 430 || !line) line = t;
      else { lines.push(line); line = w; }
    }
    if (line) lines.push(line);
    const y0 = lines.length === 1 ? H * 0.6 + 38 : H * 0.58;
    ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 8;
    lines.forEach((ln, i) => ctx.fillText(ln, W / 2, y0 + i * 74));
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W * 0.25, H * 0.86); ctx.lineTo(W * 0.75, H * 0.86); ctx.stroke();
    ctx.font = '600 26px Georgia, serif'; ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('PLAY_GROUND · WEB EXPLORER', W / 2, H * 0.86 + 40);
  }
  const tex = new THREE.CanvasTexture(cvs); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function makeSpineTexture(b) {
  const W = 128, H = 768;                       /* v2: 书脊比例 1:6，文字不再被拉伸 */
  const cvs = document.createElement('canvas'); cvs.width = W; cvs.height = H;
  const ctx = cvs.getContext('2d');
  const c = new THREE.Color(b.spine);
  const col = (k) => '#' + (new THREE.Color(c).multiplyScalar(k).getHex());
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, col(0.5)); g.addColorStop(0.5, col(1)); g.addColorStop(1, col(0.7));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 180; i++) { ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`; ctx.fillRect(Math.random() * W, Math.random() * H, 2, 2); }
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(10, 110); ctx.lineTo(W - 10, 110); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, H - 110); ctx.lineTo(W - 10, H - 110); ctx.stroke();
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.rotate(Math.PI / 2);   /* 文字自上而下 */
  ctx.font = '600 42px Georgia, serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fillText(b.title, 0, 0);
  ctx.restore();
  const tex = new THREE.CanvasTexture(cvs); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ─── 书（v2: 材质按书独立；朝向观众的是封面标题面） ─── */
const books = [];
const bookGroup = new THREE.Group();
const SPACING = 1.25, H = 2.2, BW = 0.9, BD = 0.34;
const BASE_Y = 1.765;              /* 书底 = 0.665, 刚好压住层板面(0.675) */
BOOKS.forEach((b, i) => {
  const coverF = new THREE.MeshStandardMaterial({ map: makeCoverTexture(b, true), roughness: 0.55, metalness: 0.05, emissive: new THREE.Color(0x000000) });
  const coverB = new THREE.MeshStandardMaterial({ map: makeCoverTexture(b, false), roughness: 0.6, metalness: 0.05 });
  const spineM = new THREE.MeshStandardMaterial({ map: makeSpineTexture(b), roughness: 0.6 });
  const pg = () => new THREE.MeshStandardMaterial({ color: new THREE.Color(0xf3eddb).multiplyScalar(0.96 + Math.random() * 0.04), roughness: 0.95 });
  /* 面序: +x 书缘, -x 书脊, +y 顶端, -y 底, +z 正面封面, -z 背面 */
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(BW, H, BD), [pg(), spineM, pg(), pg(), coverF, coverB]);
  mesh.castShadow = true; mesh.receiveShadow = true;
  const group = new THREE.Group();
  mesh.rotation.z = (Math.random() - 0.5) * 0.06;
  mesh.rotation.x = (Math.random() - 0.5) * 0.02;
  group.position.set(-((BOOKS.length - 1) * SPACING) / 2 + i * SPACING, BASE_Y, 0);
  group.userData = {
    ...b, baseY: BASE_Y, baseRotZ: mesh.rotation.z, baseRotX: mesh.rotation.x, index: i,
    hovered: false, lifted: 0, clickT: -1, introDone: false, introT0: 0.9 + i * 0.1, hoverPhase: Math.random() * Math.PI * 2,
  };
  group.add(mesh);
  bookGroup.add(group);
  books.push({ group, mesh, cover: coverF, data: b });
});
scene.add(bookGroup);

/* ─── 第二层架摆件（小书 / 盆栽 / 闹钟 / 相框，紧贴架面 y=3.56） ─── */

/* ─── 尘埃粒子 ─── */
const dust = (() => {
  const N = 140;
  const base = [];
  const arr = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const x = (Math.random() - 0.5) * 16, y = 0.5 + Math.random() * 6, z = (Math.random() - 0.5) * 6;
    base.push({ x, y, z, ph: Math.random() * Math.PI * 2, s: 0.3 + Math.random() * 0.5 });
    arr[i * 3] = x; arr[i * 3 + 1] = y; arr[i * 3 + 2] = z;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xaab8e6, size: 0.03, transparent: true, opacity: 0.35, sizeAttenuation: true })));
  return { arr, base };
})();

/* ─── 浮动标签 ─── */
const labels = [];
const labC = document.getElementById('labelsContainer');
books.forEach((bk) => {
  const el = document.createElement('div');
  el.className = 'book-label';
  el.style.setProperty('--ipc', bk.data.accent);
  const dot = document.createElement('span'); dot.className = 'dot';
  const tx = document.createElement('span'); tx.textContent = bk.data.icon + ' ' + bk.data.title;
  el.append(dot, tx);
  labC.appendChild(el);
  labels.push({ el, bk });
});

/* ─── UI 引用与 Modal 逻辑 ─── */
const infoPanel = document.getElementById('infoPanel');
const ipCard = document.getElementById('ipCard');
const ipIndex = document.getElementById('ipIndex');
const infoTitle = document.getElementById('infoTitle');
const infoIcon = document.getElementById('infoIcon');
const infoDesc = document.getElementById('infoDesc');
const infoBtn = document.getElementById('infoBtn');
const modal = document.getElementById('modal');
const modalHeader = document.getElementById('modalHeader');
const modalTitle = document.getElementById('modalTitle');
const modalIcon = document.getElementById('modalIcon');
const modalClose = document.getElementById('modalClose');
const modalIframe = document.getElementById('modalIframe');
const modalLoading = document.getElementById('modalLoading');
const modalLoadMsg = document.getElementById('modalLoadMsg');
const modalProg = document.getElementById('modalProg');
let selectedBook = null;
let loadTimer = null;

function showInfo(book) {
  const b = book.data;
  ipIndex.textContent = (b.index + 1).toString().padStart(2, '0') + ' / ' + BOOKS.length.toString().padStart(2, '0');
  ipCard.style.setProperty('--ipc', b.accent);
  infoIcon.textContent = b.icon;
  infoTitle.textContent = b.title;
  infoDesc.textContent = b.desc;
  infoPanel.classList.add('visible');
}
function openBook(book) {
  book.userData.clickT = clock.getElapsedTime();
  modalHeader.style.setProperty('--mc', book.data.accent);
  modalIcon.textContent = book.data.icon;
  modalTitle.textContent = book.data.title;
  modal.classList.add('active');
  modalLoading.style.display = 'flex';
  modalLoadMsg.textContent = '正在打开书页…';
  modalProg.style.transition = 'none';
  modalProg.style.width = '0%';
  void modalProg.offsetWidth;
  modalProg.style.transition = 'width 1.1s 0.4s cubic-bezier(.2,.8,.2,1)';
  modalProg.style.width = '100%';
  clearTimeout(loadTimer);
  loadTimer = setTimeout(() => { modalLoading.style.display = 'none'; }, 6000);   /* 超时兜底 */
  modalIframe.addEventListener('load', () => {
    clearTimeout(loadTimer);
    modalLoading.style.display = 'none';
  }, { once: true });
  modalIframe.src = book.data.src;
  infoPanel.classList.remove('visible');
  document.body.style.cursor = 'default';
}
function closeModal() {
  if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
  modal.classList.remove('active');
  setTimeout(() => { modalIframe.src = 'about:blank'; }, 350);
}
modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
infoBtn.addEventListener('click', () => { if (selectedBook) openBook(selectedBook); });

/* ─── 指针：位移阈值判定"点击"，UI 与 Modal 区域被排除（修复 Bug 1/2） ─── */
const mouse = new THREE.Vector2();
window.addEventListener('pointermove', (e) => {
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
});
let downXY = null;
window.addEventListener('pointerdown', (e) => {
  if (modal.classList.contains('active')) return;
  if (e.target.closest('.ui-overlay')) return;
  downXY = { x: e.clientX, y: e.clientY };
});
window.addEventListener('pointerup', (e) => {
  if (!downXY) return;
  const dx = e.clientX - downXY.x, dy = e.clientY - downXY.y;
  downXY = null;
  if (Math.hypot(dx, dy) > 10 || modal.classList.contains('active')) return;
  if (selectedBook) openBook(selectedBook);
});

/* ─── 键盘：Esc / Enter / 1-7 ─── */
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (modal.classList.contains('active')) closeModal(); return; }
  const n = parseInt(e.key, 10);
  if (Number.isInteger(n) && n >= 1 && n <= BOOKS.length) openBook(books[n - 1]);
  else if (e.key === 'Enter' && selectedBook) openBook(selectedBook);
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ─── 渲染主循环（v2: 入场动画并入主循环，不再与 float 争抢 position） ─── */
const raycaster = new THREE.Raycaster();
const zeroEm = new THREE.Color(0x000000);
const hoverEm = new THREE.Color(0x000000);
const camIn = { t0: 0.4, d: 1.8, done: false, from: new THREE.Vector3(0, 2.6, 15.5), to: new THREE.Vector3(0, 2, 10) };
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();

function updateLabels() {
  for (const L of labels) {
    L.bk.group.getWorldPosition(tmpV);
    tmpV.y += 1.5;
    const p = tmpV.clone().project(camera);
    if (p.z > 1) { L.el.style.opacity = '0'; L.el.style.left = '-999px'; continue; }
    const x = (p.x * 0.5 + 0.5) * innerWidth;
    const y = (-p.y * 0.5 + 0.5) * innerHeight;
    L.el.style.left = x + 'px';
    L.el.style.top = y + 'px';
    const d = camera.position.distanceTo(tmpV);
    const base = clamp(1 - (d - 4) / 10, 0, 1);
    L.el.style.opacity = L.bk.userData.hovered ? '1' : (0.28 * base).toFixed(3);
  }
}

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  /* 相机推近入场 */
  if (!camIn.done) {
    const p = Math.min(1, (t - camIn.t0) / camIn.d);
    if (p >= 1) camIn.done = true;
    camera.position.lerpVectors(camIn.from, camIn.to, easeOut(p));
  }
  controls.update();

  /* 尘埃漂移 */
  for (let i = 0; i < 140; i++) {
    const b = dust.base[i];
    dust.arr[i * 3 + 1] = b.y + Math.sin(t * 0.5 + b.ph) * 0.18 * b.s;
    dust.arr[i * 3] = b.x + Math.sin(t * 0.3 + b.ph * 1.7) * 0.25 * b.s;
    dust.arr[i * 3 + 2] = b.z + Math.cos(t * 0.4 + b.ph * 2.3) * 0.2 * b.s;
  }
  dust.arr.needsUpdate = true;

  /* 悬停检测 */
  const allowHover = t > 1.6;
  raycaster.setFromCamera(mouse, camera);
  const meshes = books.map(b => b.mesh);
  const hits = raycaster.intersectObjects(meshes, true);
  selectedBook = null;
  if (allowHover && hits.length) {
    const book = books.find(b => b.mesh === hits[0].object);
    if (book) {
      book.userData.hovered = true;
      selectedBook = book;
      document.body.style.cursor = 'pointer';
      showInfo(book);
    }
  }
  if (!selectedBook) {
    document.body.style.cursor = 'default';
    if (infoPanel.classList.contains('visible')) infoPanel.classList.remove('visible');
  }

  /* 书本动画：入场 → 悬浮 / 悬停 / 点击脉冲 (位置写在 group 上) */
  for (const book of books) {
    const ud = book.userData;
    if (!ud.introDone) {
      const p = Math.min(1, (t - ud.introT0) / 1.0);
      const e = REDUCED ? Math.min(1, p * 3) : easeOut(p);
      book.group.position.y = THREE.MathUtils.lerp(ud.baseY - 3.2, ud.baseY, e);
      book.mesh.rotation.z = THREE.MathUtils.lerp(ud.baseRotZ * 2.2, ud.baseRotZ, e);
      book.mesh.scale.setScalar(THREE.MathUtils.lerp(0.55, 1, e));
      if (p >= 1) ud.introDone = true;
      continue;
    }
    const fy = REDUCED ? 0 : Math.sin(t * 0.5 + ud.hoverPhase) * 0.02;
    if (ud.hovered) ud.lifted = THREE.MathUtils.lerp(ud.lifted, 0.16, 0.12);
    else ud.lifted = THREE.MathUtils.lerp(ud.lifted, 0, 0.08);
    book.group.position.y = ud.baseY + fy + ud.lifted;
    const rx = ud.hovered ? 0.07 : ud.baseRotX;
    book.mesh.rotation.x += (rx - book.mesh.rotation.x) * 0.1;
    book.mesh.rotation.z += (ud.baseRotZ - book.mesh.rotation.z) * 0.06;
    let s = ud.hovered ? 1.07 : 1;
    const clickDt = t - ud.clickT;
    if (clickDt > 0 && clickDt < 0.4) s *= 1 + 0.08 * Math.sin((clickDt / 0.4) * Math.PI);
    book.mesh.scale.lerp(new THREE.Vector3(s, s, s), 0.14);
    hoverEm.setHex(ud.data.accent);
    if (ud.hovered) book.cover.emissive.lerp(hoverEm.multiplyScalar(0.22), 0.2);
    else book.cover.emissive.lerp(zeroEm, 0.18);
  }

  updateLabels();
  renderer.render(scene, camera);
}

window.__bookshelf = { THREE, books, camera, controls };
animate();
</script>
